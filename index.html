<!DOCTYPE html>
<html lang="es">
<head>
<!-- BUILD-VERSION: v12-FIX-debugLog-crash-2026-08-22 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regalos GO</title>

<!-- SDK oficial de Telegram para Mini Apps -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- SDK de Monetag (anuncios con recompensa) -->
<script src='//libtl.com/sdk.js' data-zone='11612807' data-sdk='show_11612807'></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pkm-red: #E3350D;
    --pkm-red-dark: #B02A0C;
    --pkm-blue: #2A75BB;
    --pkm-gold: #FFCB05;
    --pkm-gold-dark: #B3A125;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #101820;
    color: #ffffff;
    padding-bottom: 76px;
  }

  .app {
    max-width: 420px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid #26262e;
  }
  .header .name { font-size: 16px; font-weight: 600; }
  .header .streak { font-size: 12px; color: #9a9aa5; margin-top: 2px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--pkm-red); display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
  }

  /* INVENTARIO */
  .inventory {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 16px;
  }
  .item-card {
    background: #1a1a22;
    border-radius: 14px;
    padding: 14px 6px;
    text-align: center;
  }
  .item-card .icon { font-size: 26px; }
  .item-card .qty { font-size: 18px; font-weight: 700; margin-top: 6px; }
  .item-card .label { font-size: 11px; color: #9a9aa5; margin-top: 2px; }

  /* BOTON ANUNCIO */
  .ad-button {
    margin: 0 16px 16px;
    background: linear-gradient(135deg, var(--pkm-red), #FF7A45);
    border: none;
    border-radius: 14px;
    height: 50px;
    width: calc(100% - 32px);
    color: white;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .ad-button:active { transform: scale(0.97); }
  .ad-button:disabled { opacity: 0.5; }

  /* MISIONES */
  .section-title {
    font-size: 13px;
    color: #9a9aa5;
    padding: 0 16px 8px;
  }
  .missions { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .mission-row {
    background: #1a1a22;
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .mission-row .progress { color: var(--pkm-red); font-weight: 600; }
  .mission-row .done { color: #00d68f; font-weight: 600; }

  /* REGALAR */
  .gift-box {
    margin: 0 16px 16px;
    background: #1a1a22;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .gift-box .friend-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #fdcb6e; color: #663c00;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .gift-box .friend-name { font-size: 13px; font-weight: 600; }
  .gift-box .friend-sub { font-size: 11px; color: #6b6b75; }
  .gift-box button {
    margin-left: auto;
    background: transparent;
    border: 1px solid #3a3a45;
    color: white;
    border-radius: 10px;
    height: 32px;
    padding: 0 14px;
    font-size: 12px;
    cursor: pointer;
  }

  /* NAV INFERIOR */
  .nav {
    display: flex;
    border-top: 1px solid #26262e;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 420px;
    margin: 0 auto;
    background: #0f0f14;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav div {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 20px;
    color: #6b6b75;
    cursor: pointer;
  }
  .nav div.active { color: var(--pkm-red); }

  .toast {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a22;
    border: 1px solid #3a3a45;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div>
      <div class="name" id="userName">Hola, Jugador</div>
      <div class="streak" id="streakText">🔥 Racha: 0 dias</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="debugIcon" onclick="toggleDebugPanel()" style="display:none;font-size:16px;cursor:pointer;color:#6b6b75;">🛠️</span>
      <div class="avatar" id="avatarLetter">?</div>
    </div>
  </div>

  <div id="debugPanel" style="display:none;margin:0 16px 12px;background:#000;border:1px solid #3a3a45;border-radius:10px;padding:10px;font-family:monospace;font-size:10px;color:#00ff88;max-height:200px;overflow-y:auto;white-space:pre-wrap;"></div>

  <!-- VISTA: INICIO -->
  <div id="viewHome">
    <div class="inventory">
      <div class="item-card">
        <div class="icon">🪙</div>
        <div class="qty" id="qtyCristales">0</div>
        <div class="label">PokéMonedas</div>
      </div>
      <div class="item-card">
        <div class="icon">🥚</div>
        <div class="qty" id="qtyHuevos">0</div>
        <div class="label">Huevos</div>
      </div>
      <div class="item-card">
        <div class="icon">🎯</div>
        <div class="qty" id="qtyCapturas">0</div>
        <div class="label">Capturas</div>
      </div>
    </div>

    <div id="boostBanner" style="display:none;margin:0 16px 12px;background:linear-gradient(135deg,#fdcb6e,#e17055);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;text-align:center;">
      ⚡ Boost x2 activo
    </div>
    <button id="activateBoostBtn" onclick="activateBoost()" style="display:none;width:calc(100% - 32px);margin:0 16px 12px;height:40px;background:linear-gradient(135deg,#fdcb6e,#e17055);border:none;border-radius:12px;color:#2d2410;font-weight:700;font-size:13px;">
      ⚡ Activar Boost x2 (3 🥚)
    </button>

    <button class="ad-button" id="watchAdBtn" onclick="watchAd()">
      ▶️ Ver anuncio: +2 a +4 PokéMonedas
    </button>

    <div class="section-title">Bono diario</div>
    <div class="missions">
      <div class="mission-row">
        <span>Racha de hoy</span>
        <span class="progress" id="missionAdsProgress">0 PokéMonedas ganadas</span>
      </div>
      <div class="mission-row">
        <span>Regalar 1 objeto</span>
        <span class="progress" id="missionGiftProgress">0/1</span>
      </div>
    </div>

    <div class="section-title">Regalar a un amigo</div>
    <div class="gift-box" style="flex-direction:column;align-items:stretch;">
      <div id="friendsListBox" style="font-size:12px;color:#6b6b75;margin-bottom:8px;">Cargando tus amigos...</div>
      <select id="giftFriendSelect" style="display:none;background:#0f0f14;border:1px solid #3a3a45;border-radius:10px;color:white;padding:10px 12px;font-size:13px;margin-bottom:8px;"></select>
      <input id="giftUsername" type="text" placeholder="o escribe el username (sin @)"
        style="background:#0f0f14;border:1px solid #3a3a45;border-radius:10px;color:white;padding:10px 12px;font-size:13px;">
      <button onclick="sendGift()" style="margin-left:0;width:100%;height:38px;background:var(--pkm-red);border:none;margin-top:8px;">Regalar 1 PokéMoneda</button>
    </div>
  </div>

  <!-- VISTA: OTRAS PANTALLAS (ranking, perfil, boost, capturas) -->
  <div id="viewOther" style="display:none;padding:16px;min-height:50vh;">
    <div id="otherContent"></div>
  </div>

  <div class="nav">
    <div class="active" id="navHome" onclick="showTab('home')">🏠</div>
    <div id="navTrophy" onclick="showTab('leaderboard')">🏆</div>
    <div id="navRules" onclick="showTab('rules')">📜</div>
    <div id="navProfile" onclick="showTab('profile')">👤</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ============================================
  // Panel de diagnostico visible (sin necesidad de F12)
  // Va PRIMERO en el archivo a proposito: varias cosas mas abajo
  // llaman a debugLog() apenas carga la pagina, y si esto se declara
  // despues, revienta todo el script con un error de inicializacion.
  // ============================================
  let debugLines = [];
  function debugLog(msg) {
    const time = new Date().toLocaleTimeString();
    debugLines.push(`[${time}] ${msg}`);
    if (debugLines.length > 30) debugLines.shift();
    const panel = document.getElementById("debugPanel");
    if (panel && panel.style.display !== "none") {
      panel.textContent = debugLines.join("\n");
      panel.scrollTop = panel.scrollHeight;
    }
    console.log(msg);
  }

  // ============================================
  // Inicializa el SDK de Telegram
  // ============================================
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ============================================
  // Anuncio automatico In-App Interstitial (Monetag)
  // No da recompensa, es distinto al rewarded de watchAd().
  // Se dispara solo segun estos parametros:
  //   - 1 anuncio cada ~0.166 horas (10 min)
  //   - 30s de espera antes del primero (le da tiempo al usuario de usar la app)
  //   - everyPage:false -> la sesion de frecuencia persiste al navegar entre tabs
  // Se llama una sola vez al arrancar la app.
  // ============================================
  if (typeof show_11612807 === "function") {
    show_11612807({
      type: 'inApp',
      inAppSettings: {
        frequency: 10,
        capping: 1,
        interval: 300,
        timeout: 90,
        everyPage: false
      }
    });
  } else {
    debugLog ? debugLog("Monetag SDK no disponible para in-app interstitial") : console.warn("Monetag SDK no disponible para in-app interstitial");
  }

  // ============================================
  // URL de tu backend en Render (CAMBIA ESTO por tu URL real)
  // ============================================
  const BACKEND_URL = "https://regalos-pogo-backend.onrender.com";

  // ============================================
  // Estado del jugador (se llena con datos reales del backend)
  // ============================================
  let state = {
    cristales: 0,
    huevos: 0,
    capturas: 0,
    streak: 0,
    adsWatchedToday: 0,
    giftsSentToday: 0,
    boostActiveUntil: null,
    referralCount: 0,
    currentLevel: 1,
    pointsRedeemedToday: 0
  };

  // Debe coincidir EXACTO con LEVEL_THRESHOLDS del backend (main.py)
  const LEVEL_THRESHOLDS = [
    { level: 2, capturesRequired: 3, label: "+20 PokéMonedas" },
    { level: 3, capturesRequired: 6, label: "+1 huevo" },
    { level: 4, capturesRequired: 10, label: "Boost x2 gratis" },
    { level: 5, capturesRequired: 15, label: "+50 PokéMonedas" },
    { level: 6, capturesRequired: 21, label: "+2 huevos" },
    { level: 7, capturesRequired: 28, label: "Insignia especial" },
  ];
  const COINS_PER_POINT = 10;
  const MAX_REDEEM_POINTS_PER_DAY = 10;

  const BOT_USERNAME = "regalos_pogo_bot"; // <-- CAMBIA ESTO por el username real de tu bot (sin @)
  const MINI_APP_SHORT_NAME = "Regalos"; // short name real, asignado en BotFather con /newapp

  let currentUser = { telegram_id: null, username: null, first_name: "Jugador" };

  // ============================================
  // Panel de diagnostico: SOLO visible para ti.
  // Reemplaza este numero por tu ID numerico de Telegram
  // (te lo da @userinfobot al escribirle /start).
  // ============================================
  const OWNER_TELEGRAM_ID = 000000000; // <-- CAMBIA ESTO por tu ID real

  async function initUser() {
    let referredBy = null;

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      currentUser.telegram_id = u.id;
      currentUser.username = u.username || null;
      currentUser.first_name = u.first_name || "Jugador";

      // Si el usuario abrio el bot desde un link de invitacion (t.me/bot?start=ID),
      // Telegram nos pasa ese ID aqui.
      if (tg.initDataUnsafe.start_param) {
        const parsed = parseInt(tg.initDataUnsafe.start_param, 10);
        if (!isNaN(parsed)) referredBy = parsed;
      }
    } else {
      // Fuera de Telegram (pruebas en navegador): usa un ID de prueba fijo
      currentUser.telegram_id = 999999999;
      currentUser.username = "test_user";
      currentUser.first_name = "Jugador de prueba";
    }

    document.getElementById("userName").textContent = "Hola, " + currentUser.first_name;

    if (currentUser.telegram_id === OWNER_TELEGRAM_ID) {
      document.getElementById("debugIcon").style.display = "inline";
    }
    document.getElementById("avatarLetter").textContent = currentUser.first_name.charAt(0).toUpperCase();

    debugLog("Iniciando... telegram_id=" + currentUser.telegram_id);
    debugLog("Conectando a: " + BACKEND_URL + "/user/init");

    try {
      const res = await fetch(BACKEND_URL + "/user/init", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          telegram_id: currentUser.telegram_id,
          username: currentUser.username,
          first_name: currentUser.first_name,
          referred_by: referredBy
        })
      });

      debugLog("Respuesta init: HTTP " + res.status);

      if (!res.ok) {
        const errText = await res.text();
        debugLog("ERROR init: " + errText);
        showToast("Error del servidor (" + res.status + ")");
        return;
      }

      const data = await res.json();
      debugLog("Datos recibidos OK: " + data.inventory.cristales + " cristales");

      state.cristales = data.inventory.cristales;
      state.huevos = data.inventory.huevos;
      state.capturas = data.inventory.capturas;
      state.streak = data.streak;
      state.adsWatchedToday = data.missions.ads_watched_today;
      state.giftsSentToday = data.missions.gifts_sent_today;
      state.boostActiveUntil = data.boost_active_until || null;
      state.referralCount = data.referral_count || 0;
      state.currentLevel = data.current_level || 1;
      state.pointsRedeemedToday = data.points_redeemed_today || 0;

      renderState();
      loadFriends();

      if (data.ad_cooldown_seconds_remaining > 0) {
        startAdCooldown(data.ad_cooldown_seconds_remaining);
      }

      if (data.daily_reward) {
        showDailyRewardModal(data.daily_reward);
      }
    } catch (err) {
      debugLog("ERROR de conexion en init: " + err.message);
      showToast("No se pudo conectar al servidor");
    }
  }

  // ============================================
  // Modal de premio por entrar hoy
  // ============================================
  function showDailyRewardModal(reward) {
    const rows = [`🪙 <b>+${reward.cristales}</b> PokéMonedas`];
    if (reward.huevos > 0) rows.push(`🥚 <b>+${reward.huevos}</b> huevo`);
    if (reward.capturas > 0) rows.push(`🎯 <b>+${reward.capturas}</b> captura`);

    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;";
    overlay.innerHTML = `
      <div style="background:#1a1a22;border:1px solid var(--pkm-gold);border-radius:18px;padding:24px 20px;text-align:center;max-width:320px;width:100%;">
        <div style="font-size:36px;">🎁</div>
        <div style="font-size:16px;font-weight:700;margin:10px 0 4px;">¡Premio por entrar hoy!</div>
        <div style="font-size:12px;color:#9a9aa5;margin-bottom:14px;">🔥 Racha: ${reward.streak} dia(s)</div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:18px;">
          ${rows.map(r => `<div>${r}</div>`).join("")}
        </div>
        <button id="dailyRewardCloseBtn" style="width:100%;height:42px;background:linear-gradient(135deg,var(--pkm-red),#FF7A45);border:none;border-radius:10px;color:white;font-weight:700;font-size:14px;">¡Genial!</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("dailyRewardCloseBtn").onclick = () => overlay.remove();
  }

  function renderState() {
    document.getElementById("qtyCristales").textContent = state.cristales;
    document.getElementById("qtyHuevos").textContent = state.huevos;
    document.getElementById("qtyCapturas").textContent = state.capturas;
    document.getElementById("streakText").textContent = "🔥 Racha: " + state.streak + " dias";
    document.getElementById("missionAdsProgress").textContent = state.adsWatchedToday + " veces hoy";
    document.getElementById("missionGiftProgress").textContent = state.giftsSentToday + "/1";

    const boostActive = state.boostActiveUntil && new Date(state.boostActiveUntil) > new Date();
    document.getElementById("boostBanner").style.display = boostActive ? "block" : "none";
    document.getElementById("activateBoostBtn").style.display = boostActive ? "none" : "block";
  }

  async function activateBoost() {
    try {
      const res = await fetch(BACKEND_URL + "/boost/activate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: currentUser.telegram_id, ad_network: "n/a" })
      });
      if (!res.ok) {
        const errData = await res.json();
        showToast(errData.detail || "No se pudo activar el boost", 4000);
        return;
      }
      const data = await res.json();
      state.cristales = data.inventory.cristales;
      state.huevos = data.inventory.huevos;
      state.capturas = data.inventory.capturas;
      state.boostActiveUntil = data.boost_active_until;
      renderState();
      showToast("⚡ Boost x2 activado por 1 hora");
    } catch (err) {
      console.error("Error activando boost:", err);
      showToast("No se pudo conectar al servidor");
    }
  }

  async function redeemPoints(coinsToRedeem) {
    if (!coinsToRedeem || coinsToRedeem < COINS_PER_POINT) {
      showToast(`Necesitas al menos ${COINS_PER_POINT} PokéMonedas para canjear`, 3000);
      return;
    }
    try {
      const res = await fetch(BACKEND_URL + "/points/redeem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: currentUser.telegram_id, coins_to_redeem: coinsToRedeem })
      });
      if (!res.ok) {
        const errData = await res.json();
        showToast(errData.detail || "No se pudo canjear", 4000);
        return;
      }
      const data = await res.json();
      state.cristales = data.inventory.cristales;
      state.huevos = data.inventory.huevos;
      state.capturas = data.inventory.capturas;
      state.pointsRedeemedToday = data.points_redeemed_today_total;
      renderState();
      showToast(`💱 +${data.points_redeemed} punto(s) de ranking`, 3000);
      showTab("profile"); // refresca la vista para actualizar el tope restante
    } catch (err) {
      console.error("Error canjeando puntos:", err);
      showToast("No se pudo conectar al servidor");
    }
  }

  function showToast(msg, duration) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, duration || 2000);
  }

  function toggleDebugPanel() {
    const panel = document.getElementById("debugPanel");
    const visible = panel.style.display === "block";
    panel.style.display = visible ? "none" : "block";
    panel.textContent = debugLines.join("\n") || "(sin actividad todavia)";
  }

  // ============================================
  // Ver anuncio - ROTACION entre varias redes
  // ============================================
  // Cada red tiene un limite practico de anuncios/dia por usuario antes de
  // que la marquen como "trafico incentivado". Repartiendo entre varias
  // redes, el usuario puede ver muchos mas anuncios en total sin que
  // ninguna red individual vea un volumen sospechoso.
  //
  // Ya tienes cuentas de Adsgram, RichAds y OnClicka de tu Diamond Bot.
  // Para activarlas aqui:
  //   1. Crea una zona "Rewarded" para ESTE juego en cada plataforma
  //   2. Pega su script SDK en el <head> (igual que hiciste con Monetag)
  //   3. Descomenta la linea correspondiente en AD_NETWORKS abajo, y
  //      reemplaza la funcion show() por la de esa red
  const AD_NETWORKS = [
    {
      name: "monetag",
      show: () => (typeof show_11612807 === "function" ? show_11612807() : Promise.reject(new Error("SDK no cargado")))
    },
    {
      // Mismo SDK/zona de Monetag, pero formato "Rewarded Popup" (se abre en
      // ventana/pestana aparte en vez de interstitial). Cuenta como otro
      // "network" dentro de la rotacion para variar el formato mostrado.
      name: "monetag_pop",
      show: () => (typeof show_11612807 === "function" ? show_11612807('pop') : Promise.reject(new Error("SDK no cargado")))
    },
    // { name: "adsgram", show: () => window.Adsgram.init({ blockId: "TU_BLOCK_ID" }).show() },
    // { name: "richads", show: () => window.RichAds.showRewarded("TU_ZONE_ID") },
    // { name: "onclicka", show: () => window.OnClicka.show("TU_ZONE_ID") },
  ];

  let adNetworkIndex = 0;

  let adCooldownInterval = null;

  function startAdCooldown(seconds) {
    const btn = document.getElementById("watchAdBtn");
    if (adCooldownInterval) clearInterval(adCooldownInterval);

    let remaining = Math.ceil(seconds);
    if (remaining <= 0) {
      btn.disabled = false;
      btn.textContent = "▶️ Ver anuncio: +2 a +4 PokéMonedas";
      return;
    }

    function renderCooldown() {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      btn.disabled = true;
      btn.textContent = `⏳ Disponible en ${m}:${s.toString().padStart(2, "0")}`;
    }

    renderCooldown();
    adCooldownInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(adCooldownInterval);
        adCooldownInterval = null;
        btn.disabled = false;
        btn.textContent = "▶️ Ver anuncio: +2 a +4 PokéMonedas";
      } else {
        renderCooldown();
      }
    }, 1000);
  }

  function watchAd() {
    const btn = document.getElementById("watchAdBtn");
    if (btn.disabled) return; // en cooldown, no hacer nada

    btn.disabled = true;
    btn.textContent = "Cargando anuncio...";

    const network = AD_NETWORKS[adNetworkIndex % AD_NETWORKS.length];
    adNetworkIndex++;

    debugLog("Boton tocado, usando red: " + network.name);

    network.show().then(() => {
      debugLog("Anuncio completado (" + network.name + "), avisando al servidor...");
      onAdCompleted(network.name);
    }).catch((err) => {
      debugLog("ERROR del anuncio (" + network.name + "): " + (err && err.message ? err.message : JSON.stringify(err)));
      showToast("No se pudo completar el anuncio, intenta de nuevo");
      btn.disabled = false;
      btn.textContent = "▶️ Ver anuncio: +2 a +4 PokéMonedas";
    });
  }

  async function onAdCompleted(adNetwork) {
    debugLog("Llamando a: " + BACKEND_URL + "/ad-completed");
    try {
      const res = await fetch(BACKEND_URL + "/ad-completed", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: currentUser.telegram_id, ad_network: adNetwork || "monetag" })
      });

      debugLog("Respuesta del servidor: HTTP " + res.status);

      if (res.status === 429) {
        const errData = await res.json().catch(() => null);
        const secondsRemaining = errData && errData.detail && errData.detail.seconds_remaining
          ? errData.detail.seconds_remaining
          : 600;
        showToast("Todavia en cooldown, espera un poco");
        startAdCooldown(secondsRemaining);
        return;
      }

      if (!res.ok) {
        const errText = await res.text();
        debugLog("ERROR del servidor: " + errText);
        showToast("Error del servidor (" + res.status + ")");
        const btn = document.getElementById("watchAdBtn");
        btn.disabled = false;
        btn.textContent = "▶️ Ver anuncio: +2 a +4 PokéMonedas";
        return;
      }

      const data = await res.json();
      debugLog("Recompensa recibida: +" + data.reward_quantity + " PokéMonedas");

      state.cristales = data.inventory.cristales;
      state.huevos = data.inventory.huevos;
      state.capturas = data.inventory.capturas;
      state.adsWatchedToday = data.mission_progress;

      renderState();
      showToast("+" + data.reward_quantity + " PokéMonedas");

      if (data.earned_egg) {
        setTimeout(() => showToast("🥚 +1 huevo (cada 10 anuncios)", 3000), 2200);
      }

      if (data.mission_completed) {
        showToast("¡Bono diario desbloqueado! +15 PokéMonedas extra");
      }

      if (data.level_up) {
        state.currentLevel = data.level_up.new_level;
        setTimeout(() => showToast(`⭐ ¡Subiste a Nivel ${data.level_up.new_level}!`, 4000), 3200);
      }

      startAdCooldown(data.cooldown_seconds || 600);
    } catch (err) {
      debugLog("ERROR de conexion: " + err.message);
      showToast("No se pudo guardar tu recompensa, intenta de nuevo");
      const btn = document.getElementById("watchAdBtn");
      btn.disabled = false;
      btn.textContent = "▶️ Ver anuncio: +2 a +4 PokéMonedas";
    }
  }

  // ============================================
  // Amigos referidos (para regalar sin escribir username)
  // ============================================
  async function loadFriends() {
    const box = document.getElementById("friendsListBox");
    const select = document.getElementById("giftFriendSelect");
    try {
      const res = await fetch(BACKEND_URL + "/friends/" + currentUser.telegram_id);
      const data = await res.json();
      const friends = (data && data.friends) || [];

      if (friends.length === 0) {
        box.textContent = "Aun no tienes amigos invitados. Cuando alguien entre con tu link, va a aparecer aqui.";
        select.style.display = "none";
        return;
      }

      box.textContent = "Elige a quien regalarle:";
      select.innerHTML = `<option value="">— Selecciona un amigo —</option>` +
        friends.map(f => `<option value="${f.username}">${f.first_name} (@${f.username})</option>`).join("");
      select.style.display = "block";
    } catch (err) {
      box.textContent = "No se pudo cargar tu lista de amigos.";
      select.style.display = "none";
    }
  }

  // ============================================
  // Regalar objeto
  // ============================================
  async function sendGift() {
    const select = document.getElementById("giftFriendSelect");
    const usernameInput = document.getElementById("giftUsername");

    const receiverUsername = (select && select.value)
      ? select.value
      : usernameInput.value.trim().replace("@", "");

    if (!receiverUsername) {
      showToast("Elige un amigo o escribe un username");
      return;
    }
    if (state.cristales < 1) {
      showToast("No tienes PokéMonedas para regalar");
      return;
    }

    try {
      const res = await fetch(BACKEND_URL + "/send-gift", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender_id: currentUser.telegram_id,
          receiver_username: receiverUsername,
          item_type_id: 1,
          quantity: 1
        })
      });

      if (!res.ok) {
        const errData = await res.json();
        showToast(errData.detail || "No se pudo enviar el regalo");
        return;
      }

      const data = await res.json();
      state.cristales = data.inventory.cristales;
      state.huevos = data.inventory.huevos;
      state.capturas = data.inventory.capturas;
      state.giftsSentToday = data.mission_progress;

      renderState();
      showToast("Regalo enviado 🎁");
      usernameInput.value = "";
      if (select) select.value = "";

      if (data.mission_completed) {
        showToast("Mision completada: +1 huevo extra");
      }
    } catch (err) {
      console.error("Error enviando regalo:", err);
      showToast("No se pudo conectar al servidor");
    }
  }

  // ============================================
  // Compartir link de invitacion
  // ============================================
  function shareInviteLink() {
    if (!currentUser.telegram_id) {
      showToast("Espera a que cargue tu perfil");
      return;
    }

    // IMPORTANTE: usamos "startapp" (no "start") para que el link abra la
    // Mini App DIRECTAMENTE, ya con el parametro de referido disponible en
    // tg.initDataUnsafe.start_param. El formato "?start=" en cambio abre el
    // chat del bot (no la Mini App), y ahi se pierde el dato del referido
    // si no tienes un bot aparte que lo reenvie.
    const inviteLink = `https://t.me/${BOT_USERNAME}/${MINI_APP_SHORT_NAME}?startapp=${currentUser.telegram_id}`;
    const shareText = "Unete y gana premios reales jugando 🎁";

    if (tg && tg.openTelegramLink) {
      // Abre el selector nativo de Telegram para compartir el link con quien quieras
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent(shareText)}`;
      tg.openTelegramLink(shareUrl);
    } else {
      // Fuera de Telegram: copia el link al portapapeles como respaldo
      navigator.clipboard.writeText(inviteLink).then(() => {
        showToast("Link copiado: " + inviteLink);
      }).catch(() => {
        showToast(inviteLink);
      });
    }
  }

  // ============================================

  // ============================================

              ${u.in_top_10_percent ? '<span style="font-size:14px;">🏆</span>' : ""}
            </div>

        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = viewHeader("🏆 Ranking semanal") + "<p style='color:#ff6b6b;font-size:13px;'>No se pudo cargar el ranking.</p>";

    }

    if (tab === "rules") {

      let winnersLine = "El top <b style='color:var(--pkm-gold);'>10%</b> del ranking semanal.";

          winnersLine = `Actualmente esta semana ganarian <b style="color:var(--pkm-gold);">${data.top_10_percent_count}</b> jugador(es) — el top <b style="color:var(--pkm-gold);">10%</b> de los ${data.total_active_users} que tienen puntos esta semana.`;
        }
      } catch (err) {

      }

      content.innerHTML = viewHeader("📜 Reglas del juego") + `
        <div style="background:#1a1a22;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;">

          <div>
            <p style="font-size:13px;font-weight:700;color:var(--pkm-gold);margin-bottom:6px;">🎮 De que trata Regalos GO</p>
            <p style="font-size:13px;color:#d0d0d8;line-height:1.5;">
              Cada dia que entras y juegas ganas <b>PokéMonedas</b> 🪙, <b>huevos</b> 🥚 y <b>capturas</b> 🎯.
              Todo lo que hagas en la app tambien te suma puntos al ranking semanal: cuanto mas juegas,
              mas arriba subes, y los mejores de la semana ganan el premio.
            </p>
          </div>

          <div>
            <p style="font-size:13px;font-weight:700;color:var(--pkm-gold);margin-bottom:6px;">🏆 ¿Quien gana el premio?</p>
            <p style="font-size:13px;color:#d0d0d8;line-height:1.5;">${winnersLine} El ranking se reinicia cada lunes.</p>
          </div>

          <div>
            <p style="font-size:13px;font-weight:700;color:var(--pkm-gold);margin-bottom:6px;">🏅 Como se ganan los puntos del ranking</p>
            <ul style="font-size:13px;color:#d0d0d8;line-height:1.6;padding-left:18px;">
              <li>Ver un anuncio: <b>+1 punto</b></li>
              <li>Completar los 25 anuncios del dia: <b>+10 puntos</b> extra</li>
              <li>Entrar a la app cada dia (premio de bienvenida): <b>+3 puntos</b></li>
              <li>Regalar 1 objeto a un amigo: <b>+2 puntos</b></li>
              <li>Invitar a un amigo nuevo: <b>+5 puntos</b></li>
            </ul>
          </div>

          <div>
            <p style="font-size:13px;font-weight:700;color:var(--pkm-gold);margin-bottom:6px;">🪙 Como ganar PokéMonedas</p>
            <ul style="font-size:13px;color:#d0d0d8;line-height:1.6;padding-left:18px;">
              <li>Ver anuncios: +2 a +4 PokéMonedas cada uno (hasta 25 al dia, con un descanso de 10 minutos entre cada uno)</li>
              <li>Completar los 25 anuncios del dia: +15 PokéMonedas de bono, y ademas te regala 1 captura 🎯</li>

          📤 Invitar amigos: +10 PokéMonedas por cada uno

  }

  function viewHeader(titleText) {
    return `<div style="margin-bottom:16px;">
      <h2 style="font-size:16px;">${titleText}</h2>
    </div>`;
  }

  // ============================================
  // Arranque
  // ============================================
  initUser();
  renderState();
</script>
